# Publica o site no GitHub Pages a cada push na main (endereço: https://mariaamorimhs-pixel.github.io/v2-academy/).
# Alternativa ao Railway. O endereço e a chave publishable do Supabase são públicos por natureza (vão no site);
# para trocar, crie as variáveis VITE_SUPABASE_URL / VITE_SUPABASE_KEY em Settings → Secrets and variables → Actions → Variables.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://bapvpfbvwktwbnymwrje.supabase.co' }}
          VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY || 'sb_publishable_5KK6wcRM1pdWVraBJi6o9g_Qoqmet9z' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - id: publicar
        uses: actions/deploy-pages@v4
